name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned tooling
        run: npm ci
      - name: Repository checks
        run: npm run check
      - name: Build deterministic plugin archive
        run: npm run pack:plugin
      - name: Token export smoke
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          python scripts/token_export.py --input assets/tokens/material3-expressive.json --target compose --output "$tmp/Theme.kt"
          python scripts/token_export.py --input assets/tokens/awwwards-editorial.json --target tailwind --output "$tmp/theme.css"
          python scripts/token_export.py --input assets/tokens/awwwards-editorial.json --target swiftui --output "$tmp/DesignSystem.swift"
          python scripts/token_export.py --input assets/tokens/fluent-2.json --target winui --output "$tmp/Resources.xaml"
          grep -q "val colorScheme: ColorScheme = lightColorScheme(" "$tmp/Theme.kt"
          grep -q -- "--color-ink:" "$tmp/theme.css"
          ! grep -q -- "--color-color-" "$tmp/theme.css"

name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python helper tests
        run: python -m unittest discover -s tests
      - name: SkillForge lint
        run: npx agent-skillforge lint . --format text --strict --profile marketplace
      - name: SkillForge smoke
        run: npx agent-skillforge smoke .
      - name: Public readiness
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          errors = []

          required = [
              ".codex-plugin/plugin.json",
              ".claude-plugin/plugin.json",
              ".claude-plugin/marketplace.json",
              "README.md",
              "CHANGELOG.md",
              "LICENSE",
              "NOTICE",
              "SECURITY.md",
              "docs/public-plugin-readiness.md",
              "docs/review-contract.md",
              "assets/logo/stark-mark.svg",
              "assets/logo/stark-favicon.svg",
              "assets/logo/stark-mark-ink.svg",
              "assets/logo/README.md",
              "skillforge.json",
          ]
          for item in required:
              if not (root / item).is_file():
                  errors.append(f"missing required public file: {item}")

          codex = json.loads((root / ".codex-plugin/plugin.json").read_text())
          claude = json.loads((root / ".claude-plugin/plugin.json").read_text())
          marketplace = json.loads((root / ".claude-plugin/marketplace.json").read_text())
          market_plugin = marketplace.get("plugins", [{}])[0]
          versions = {
              "codex": codex.get("version"),
              "claude": claude.get("version"),
              "marketplace": market_plugin.get("version"),
          }
          if len(set(versions.values())) != 1:
              errors.append(f"version mismatch: {versions}")
          if codex.get("repository") != "https://github.com/f0d010c/stark":
              errors.append("codex repository must point to f0d010c/stark")
          if market_plugin.get("source", {}).get("repo") != "f0d010c/stark":
              errors.append("marketplace source repo must be f0d010c/stark")

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_prefixes = ("design-previews/", "screenshots/", "screenshots-", "tmp-pack/", "node_modules/")
          forbidden_exact = {".github/RELEASE_NOTES_v0.3.0.md", "scripts/public_readiness.py"}
          for path in tracked:
              normalized = path.replace("\\", "/")
              if normalized in forbidden_exact or normalized.startswith(forbidden_prefixes):
                  errors.append(f"local-only tracked path: {path}")

          secret_patterns = [
              re.compile(r"C:\\Users\\", re.I),
              re.compile(r"OneDrive\\Desktop", re.I),
              re.compile(r"sk-[A-Za-z0-9]{20,}"),
              re.compile(r"ghp_[A-Za-z0-9]{20,}"),
              re.compile(r"github_pat_[A-Za-z0-9_]{20,}"),
              re.compile(r"(?i)\b(api[_-]?key|password|bearer)\s*[:=]\s*['\"]?[A-Za-z0-9_./+=-]{16,}"),
              re.compile(r"-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----"),
          ]
          binary_suffixes = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".pdf", ".zip", ".gz"}
          for path in tracked:
              if Path(path).suffix.lower() in binary_suffixes:
                  continue
              try:
                  text = (root / path).read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), start=1):
                  if path == "docs/public-plugin-readiness.md" and "rg -n" in line:
                      continue
                  for pattern in secret_patterns:
                      if pattern.search(line):
                          errors.append(f"possible private value in {path}:{line_no}")

          if errors:
              print("Public readiness failed:")
              for error in errors:
                  print(f"- {error}")
              raise SystemExit(1)

          print("Public readiness passed.")
          PY
      - name: Token export smoke
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          python scripts/token_export.py --input assets/tokens/material3-expressive.json --target compose --output "$tmp/Theme.kt"
          python scripts/token_export.py --input assets/tokens/awwwards-editorial.json --target tailwind --output "$tmp/theme.css"
          python scripts/token_export.py --input assets/tokens/awwwards-editorial.json --target swiftui --output "$tmp/DesignSystem.swift"
          python scripts/token_export.py --input assets/tokens/fluent-2.json --target winui --output "$tmp/Resources.xaml"
          grep -q "val colorScheme: ColorScheme = lightColorScheme(" "$tmp/Theme.kt"
          grep -q -- "--color-ink:" "$tmp/theme.css"
          ! grep -q -- "--color-color-" "$tmp/theme.css"
